<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>COINFLIP</title>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body { font-family: "Google Sans", "Google Sans Text", sans-serif; margin: 0; padding: 60px 24px 40px;
         --field-x: 260px; --sel:#2563eb; --sel-soft:#9ec1f5; }

  /* top bar. The BAR is the positioned element; the two readouts inside it are
     ordinary flow content, so a narrow screen can drop the whole thing into the
     document by changing one property instead of un-pinning two corners. */
  #topbar { position:absolute; top:0; left:0; right:0; margin:8px;
            display:flex; justify-content:space-between; align-items:flex-start;
            flex-wrap:wrap; gap:4px 16px; }
  #money { font-weight:700; }

  #form { display:block; position:relative; }
  #grid { display:grid; grid-template-columns:auto 1fr auto; row-gap:22px; column-gap:16px; align-items:start; }
  .dot {
    width:14px; height:14px; border-radius:50%;
    border:2px solid #ccc; background:#ccc; padding:0; margin-top:4px;
    transition:transform 0.1s, background 0.15s, border-color 0.15s; cursor:default;
    align-self:start;
  }
  .dot.current { background:black; border-color:black; }
  .dot.clickable { cursor:pointer; }
  .dot.clickable:hover { transform:scale(1.3); }
  .dot.hidden { visibility:hidden; }
  .row-label { font-weight:700; }
  .row-choices { margin-top:4px; }
  .row-mult { font-weight:700; text-align:right; color:#9a9a9a; margin-top:4px; }
  .aspect-cell.locked { color:#9a9a9a; }
  .aspect-cell.hidden { visibility:hidden; }
  .row-mult.hidden { visibility:hidden; }
  .grid-divider { grid-column:1 / -1; border-top:1px solid #ccc; margin-top:6px; }
  .total-mult { color:black; }
  .total-content { font-weight:700; }
  .field-row { display:grid; grid-template-columns:var(--field-x) auto; align-items:start; }
  /* every row's staked amount sits in one aligned column, Total included */
  .row-amt { color:#9a9a9a; white-space:nowrap; font-variant-numeric:tabular-nums; margin-top:4px; }
  .total-content .row-amt { color:black; margin-top:0; }
  .field-pre { display:inline-flex; align-items:center; gap:14px; white-space:nowrap; }

  /* bet bar: bet (left) — Flip (center) — coin (right) */
  #betbar { display:flex; justify-content:center; margin-top:28px; }
  #betbar .bet-side { justify-self:end; text-align:right; }
  #betbar .coin-side { justify-self:start; }

  /* busker mode: minimal one-line bar, then the coin to scrub */
  #brokeScreen { margin-top:40px; }
  .broke-bar { display:flex; align-items:center; gap:16px; }
  .broke-label { font-weight:700; }
  /* touch-action:none so a scrub drags instead of scrolling the page — the same
     reason the dial carries it. The coin is the control, so it takes the cursor. */
  #cleanCoin { touch-action:none; cursor:grab; display:block; margin-top:20px;
               width:min(72vw, 260px); height:auto; transition:opacity .15s; }
  #cleanCoin.scrubbing { cursor:grabbing; }
  #cleanCoin.locked { opacity:.35; cursor:default; }
  #debugBar { margin-top:60px; padding-top:16px; border-top:1px solid #eee; }
  #debugBar button { font:inherit; color:#9a9a9a; background:none; border:1px solid #ddd; padding:4px 10px; cursor:pointer; }
  #debugBar button:hover { color:black; border-color:black; }
  #brokeResult { font-weight:700; font-size:18px; min-width:36px; }
  .chosen { font-style:normal; }

  /* coin */
  #coinVis { perspective:400px; cursor:pointer; width:64px; transition:opacity .15s; }
  #coinVis.locked { opacity:.35; cursor:default; }
  .coin { width:64px; height:64px; position:relative; transform-style:preserve-3d; transition:transform 0.12s linear; }
  #spinCounter { margin-top:8px; font-weight:700; font-variant-numeric:tabular-nums; }
  .coin.tails { transform:rotateY(180deg); }
  .coin .face {
    position:absolute; width:64px; height:64px; border-radius:50%;
    border:2px solid black; display:flex; align-items:center; justify-content:center;
    backface-visibility:hidden; -webkit-backface-visibility:hidden; font-size:12px; background:white;
  }
  .coin .back { transform:rotateY(180deg); }

  /* direction dial */
  #dial .quad { transition:transform 0.08s; transform-origin:80px 80px; }
  #dial { touch-action:none; user-select:none; }   /* so a drag paints instead of scrolling */
  /* arrows are driven by CSS transform so they SLIDE between positions; when a
     pair merges, both members travel to the same cardinal spot and overlap = one arrow */
  #dial-arrows [data-arrow] { transform-box:view-box; transform-origin:0 0;
    transition:transform .3s cubic-bezier(.22,.9,.28,1); }

  /* text choices (no buttons) */
  .opt {
    color:#9a9a9a; cursor:pointer; margin-right:14px;
    display:inline-block; transition:color 0.12s, opacity 0.2s;
  }
  .opt:hover { color:black; }
  /* selection reads as COLOUR, not absence — unpicked options stay legible */
  .txtfield { color:#9a9a9a; }
  .txtfield input { font:inherit; font-weight:400; border:none; border-bottom:1px solid #ccc; outline:none; width:70px; }
  .iconbtn { color:#c4c4c4; cursor:pointer; display:inline-flex; align-items:center; margin-left:10px; transition:color .12s; }

  /* staged result reveal */
  .opt { transition:color .12s, opacity .2s, transform .25s; }
  .opt.res-win  { color:#1a9e3f !important; opacity:1 !important; transform:scale(1.35); transform-origin:left center; }
  .opt.res-loss { color:#d12d2d !important; opacity:1 !important; }
  #dial .quad { transition:transform .28s, fill .28s; }
  #dial .quad.res-win  { fill:#1a9e3f; transform:scale(1.18); }
  #dial .quad.res-loss { fill:#d12d2d; }
  .total-mult { transition:transform .12s; display:inline-block; }
  /* #stepTotal colour is set inline per-frame — see positionColour() */
  .row-mult.res-win  { color:#1a9e3f; }
  .row-mult.res-loss { color:#d12d2d; }
  /* the running total lives IN the amount column, sliding through the ₿ values
     rather than floating centred over the form */
  #stepTotal { position:absolute; text-align:left; white-space:nowrap;
               font-weight:700; font-size:22px; line-height:24px; visibility:hidden;
               font-variant-numeric:tabular-nums; pointer-events:none; transform-origin:left center;
               transition:top .5s cubic-bezier(.22,.9,.28,1), left .5s cubic-bezier(.22,.9,.28,1), opacity .3s; }
  .row-amt.amt-hidden { visibility:hidden; }
  .iconbtn:hover { color:black; }
  .iconbtn.on { color:black; }
  .txtfield input::-webkit-outer-spin-button,
  .txtfield input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .txtfield input[type=number] { -moz-appearance:textfield; }
  .txtfield input:focus { border-color:black; }

  /* spin line bet: typed line + optional higher/lower modifier */
  .spin-entry { display:inline-flex; align-items:center; gap:14px; }
  .opt.on { color:var(--sel); }
  .opt.dead { opacity:.25; pointer-events:none; }
  #lineWrap { display:inline-block; transform-origin:left center; transition:transform .25s; }
  #lineWrap.res-win { transform:scale(1.35); }
  #lineWrap.res-win input  { color:#1a9e3f; border-color:#1a9e3f; }
  #lineWrap.res-loss input { color:#d12d2d; border-color:#d12d2d; }
  #spinLanded { visibility:hidden; min-width:46px; color:#1a9e3f; }

  /* the two presets. Selection is COLOUR, as everywhere else: the one you did
     not pick stays grey and fully legible, with its numbers still showing, so
     the trade you are turning down is always on screen next to the one you took. */
  .mode-row { display:grid; grid-template-columns:var(--field-x) auto; align-items:baseline; }
  .opt.mode { font-weight:700; letter-spacing:.04em; }
  .mode-stat { color:#9a9a9a; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .aspect-cell.void { opacity:.25; pointer-events:none; }
  #bankLine { font-weight:400; color:#9a9a9a; margin-top:2px; }
  #bankCtl { margin-left:10px; white-space:nowrap; }
  #bankInput { font:inherit; width:64px; border:none; border-bottom:1px solid #ccc;
               outline:none; background:none; color:inherit; text-align:right; }
  #bankInput:focus { border-color:black; }
  #bankInput::-webkit-outer-spin-button, #bankInput::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  #bankInput[type=number] { -moz-appearance:textfield; }
  #bankBtn { cursor:pointer; text-decoration:underline; margin-left:8px; }
  #bankBtn:hover { color:black; }
  #bankCtl.off { opacity:.35; pointer-events:none; }
  #m-spread { font-weight:400; }
  /* The Edge reads purple, never green — it is a different kind of event */
  .opt.res-edge { color:#8b4ad6 !important; opacity:1 !important; transform:scale(1.35); transform-origin:left center; }
  .row-mult.res-edge { color:#8b4ad6; }

  /* ==================== NARROW SCREENS ====================
     ADDITIVE ONLY, and STRUCTURE IS NEVER TOUCHED. The grid stays
     dot | content | amount at every width, and .field-row keeps splitting the
     content cell into var(--field-x) + amount.
     That is load-bearing, not tidiness. revealResults() positions #stepTotal
     from the LIVE offsetLeft of the Total row's .row-amt and the live offsetTop
     of each row, both resolved against #form. So the sliding total follows
     whatever the layout does for free — but only while the amount column is
     still a column. Stacking the amount under the choices would look correct at
     rest and put the readout in the wrong place the instant it moved, which is
     the kind of bug that survives every static check.
     Everything below is therefore width, spacing and wrapping. Nothing here
     reparents an element, positions an ancestor of #stepTotal, or introduces a
     transform/filter between #form and a row — any of which would silently
     re-base the offsets the reveal is computed from. */

  @media (max-width: 560px) {
    /* --field-x has a hard floor: the dial is the widest thing in the choices
       column and must fit inside it, plus slack so a selected quadrant's 1.18
       scale does not reach into the amounts. */
    body { padding:16px 16px 40px; --field-x:168px; }

    /* nothing left to hang over, so the bar joins the flow */
    #topbar { position:static; margin:0 0 22px; }

    #grid { column-gap:12px; row-gap:20px; }

    /* the coin IS the flip control — give it a finger */
    #coinVis { width:80px; }
    .coin, .coin .face { width:80px; height:80px; }

    /* the choices are bare spans, so they have only their text as hit area.
       Vertical padding buys a real target without making them read as buttons —
       and padding is static, so it cannot violate the rule that nothing moves
       when something scales. */
    .opt { padding:8px 0; margin-right:18px; }
    #bankBtn { display:inline-block; padding:8px 0; }

    /* line + higher + lower + landed readout is ~250px and will not fit the
       choices column at this width. Wrapping keeps it inside its own column
       instead of overrunning the amounts. */
    .spin-entry { flex-wrap:wrap; gap:8px 12px; }

    /* Spread is the one row with no amount to line up against (checked: #a-spread
       has no .row-amt, and the reveal only ever targets side/orient/spins), so
       it is free to give the slider the width instead of starting it at the
       amount column. */
    #a-spread .mode-row { grid-template-columns:auto 1fr; column-gap:14px; }

    /* the readout now slides down a narrower column */
    #stepTotal { font-size:19px; line-height:21px; }

    .broke-bar { flex-wrap:wrap; gap:10px 16px; }
    #debugBar { display:flex; flex-wrap:wrap; gap:8px; margin-top:40px; }
    #out { overflow-x:auto; }
  }

  @media (max-width: 400px) {
    body { padding:14px 14px 36px; --field-x:150px; }
    /* CSS width beats the SVG width attribute and the viewBox is unchanged, so
       every internal coordinate — including .quad's 80px transform-origin and
       the arrows' view-box transform-box — still refers to the same places. */
    #dial { width:142px; height:142px; }
    #grid { column-gap:10px; }
    .opt { margin-right:14px; }
    #stepTotal { font-size:18px; line-height:20px; }
  }
</style>
</head>
<body>

<!-- money and timer were each absolutely positioned into a corner. Wrapping them
     in one bar changes nothing on desktop — the bar is the absolute element now
     and space-between puts the two back in the same two corners — but it gives
     narrow screens something to collapse INTO the flow, which two independently
     positioned corners could never do. -->
<div id="topbar">
  <div id="money">
    <div><span id="bal">0</span> ₿</div>
    <div id="bankLine">banked <span id="bankAmt">0</span> ₿
      <span id="bankCtl"><input type="number" id="bankInput" min="1" step="1"><span id="bankBtn">bank</span></span>
    </div>
  </div>
  <div id="timerBar">Next flip in <b id="timer">00</b></div>
</div>

<!-- ============ BUSKER MODE: clean a coin for a stake ============
     Replaces the Broke Flip's heads-or-tails call. The old recovery cost you the
     day to bust and then failed half the time, costing another — which is most of
     why 40.3% of days were spent unable to play. A recovery that ALWAYS pays
     drops that to 26.4%. See minigame/clean.js for why the amount is a separate
     knob from the determinism.

     No instructions here on purpose: a filthy coin invites rubbing, and the
     payout counting up under the hand says the rest. -->
<div id="brokeScreen" style="display:none">
  <div class="broke-bar">
    <span class="broke-label">0 ₿.</span>
    <span id="brokeResult"></span>
  </div>
  <canvas id="cleanCoin" width="640" height="640"></canvas>
</div>

<!-- ============ VERTICAL FORM ============ -->
<div id="form" style="display:none">
  <div id="stepTotal">0</div>
  <div id="grid">

    <!-- SIDE -->
    <button class="dot" data-idx="0"></button>
    <div class="aspect-cell" id="a-side">
      <div class="row-label">Side</div>
      <div class="field-row">
        <div class="row-choices" id="side-choices">
          <span class="opt pick" data-val="Heads">Heads</span>
          <span class="opt pick" data-val="Tails">Tails</span>
          <span class="opt pick" data-val="Edge">Edge 🤯</span>
        </div>
        <span class="row-amt" id="amt-side"></span>
      </div>
    </div>
    <div class="row-mult" id="m-side"></div>

    <!-- DIRECTION -->
    <button class="dot hidden" data-idx="1"></button>
    <div class="aspect-cell hidden" id="a-orient">
      <div class="row-label">Orientation</div>
      <div class="field-row">
      <div class="row-choices" id="orient-choices">
        <svg id="dial" width="160" height="160" viewBox="0 0 160 160" style="cursor:pointer; overflow:visible">
          <circle cx="80" cy="80" r="70" fill="none" stroke="black"></circle>
          <line x1="80" y1="10" x2="80" y2="150" stroke="black"></line>
          <line x1="10" y1="80" x2="150" y2="80" stroke="black"></line>
          <path class="quad" d="M80,80 L80,10 A70,70 0 0,1 150,80 Z" fill="transparent" data-quad="NE"></path>
          <path class="quad" d="M80,80 L150,80 A70,70 0 0,1 80,150 Z" fill="transparent" data-quad="SE"></path>
          <path class="quad" d="M80,80 L80,150 A70,70 0 0,1 10,80 Z" fill="transparent" data-quad="SW"></path>
          <path class="quad" d="M80,80 L10,80 A70,70 0 0,1 80,10 Z" fill="transparent" data-quad="NW"></path>
          <!-- one arrow per quadrant, pointing along that sector's own diagonal.
               The sectors sit between the cross lines, so their true directions
               are the diagonals — cardinal letters described the boundaries, not
               the sectors. Arrows are inert so they never swallow a drag. -->
          <g id="dial-arrows" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round" pointer-events="none">
            <g data-arrow="NE" transform="translate(111.8,48.2) rotate(45)"><path d="M0,9 L0,-9 M-5,-4 L0,-9 L5,-4"/></g>
            <g data-arrow="SE" transform="translate(111.8,111.8) rotate(135)"><path d="M0,9 L0,-9 M-5,-4 L0,-9 L5,-4"/></g>
            <g data-arrow="SW" transform="translate(48.2,111.8) rotate(225)"><path d="M0,9 L0,-9 M-5,-4 L0,-9 L5,-4"/></g>
            <g data-arrow="NW" transform="translate(48.2,48.2) rotate(315)"><path d="M0,9 L0,-9 M-5,-4 L0,-9 L5,-4"/></g>
            <!-- two adjacent quadrants are just one cardinal direction, so their
                 diagonals collapse into this single arrow on their shared edge -->
            <g id="dial-merged" style="display:none"><path d="M0,9 L0,-9 M-5,-4 L0,-9 L5,-4"/></g>
          </g>
        </svg>
      </div>
      <span class="row-amt" id="amt-orient"></span>
      </div>
    </div>
    <div class="row-mult hidden" id="m-orient"></div>

    <!-- SPINS -->
    <button class="dot hidden" data-idx="2"></button>
    <div class="aspect-cell hidden" id="a-spins">
      <div class="row-label">Spin <span style="font-weight:400;color:#9a9a9a">(<b id="spinRange">4–20</b>)</span></div>
      <div class="field-row">
        <div class="row-choices" id="spins-choices">
          <span class="spin-entry">
            <span class="txtfield" id="lineWrap"><input type="text" id="spinLine" placeholder="#" size="4"></span>
            <span class="opt pick2" data-val="gt">higher</span>
            <span class="opt pick2" data-val="lt">lower</span>
            <span id="spinLanded"></span>
          </span>
        </div>
        <span class="row-amt" id="amt-spins"></span>
      </div>
    </div>
    <div class="row-mult hidden" id="m-spins"></div>

    <!-- divider spans the whole table -->
    <div class="grid-divider"></div>

    <!-- SPREAD — one control instead of per-row amounts -->
    <div></div>
    <div class="aspect-cell hidden" id="a-spread">
      <div class="mode-row">
        <span class="opt mode" data-mode="spread">SPREAD</span>
        <span class="mode-stat" id="stat-spread"></span>
      </div>
      <div class="mode-row">
        <span class="opt mode" data-mode="ride">RIDE</span>
        <span class="mode-stat" id="stat-ride"></span>
      </div>
    </div>
    <div class="row-mult hidden" id="m-spread"></div>

    <!-- TOTAL row: same 3 columns as the aspect rows -->
    <div></div>
    <div class="total-content">
      <div class="field-row">
        <span class="row-label">Total</span>
        <span class="row-amt">₿ <span id="stake">0</span></span>
      </div>
    </div>
    <div class="row-mult total-mult"><span id="finalX">×</span><span id="finalMult">0</span></div>

  </div>
</div>

<!-- click the coin to flip -->
<div id="betbar" style="display:none">
  <div class="coin-side">
    <div id="coinVis"></div>
    <div id="spinCounter">spin: 0.0</div>
  </div>
</div>

<div id="out"></div>

<div id="debugBar">
  <button id="debugReset">reset</button>
  <button id="dbgTimerStart">start timer</button>
  <button id="dbgTimerZero">timer 00</button>
</div>

<script type="module">
// ===== BEGIN inlined minigame/clean.js — GENERATED, DO NOT EDIT HERE =====
// Written by `node minigame/build-demo.mjs`. Edit minigame/clean.js and re-run.
//
// This file has to stay a single self-contained page with no imports (it is
// published as a standalone artifact), and the payout rule has to live in ONE
// place because it is the game's only money faucet. A hand-maintained copy would
// satisfy the first and quietly break the second. tools/verify-clean.mjs
// evaluates THIS block and the module side by side and fails on any divergence.

// minigame/clean.js
// ---------------------------------------------------------------------------
// COIN CLEANING — the busker's recovery. You are broke, so you scrub a coin for
// a stake. Replaces the Broke Flip's heads-or-tails call.
//
// WHY IT EXISTS, and why the payout rule is shaped the way it is.
// The old recovery was a 50/50 for 50 B. Busting cost you the day, and then
// HALF THE TIME the recovery failed and cost you another one — which is most of
// why 40.3% of all days are spent unable to play. Measured: a recovery that
// ALWAYS pays drops that to 26.4%. The win comes from removing the second coin
// flip, NOT from the amount — paying 25 and paying 50 give identical dead-day
// figures. So determinism is the mechanism and the amount is a separate knob
// that sizes the economy.
//
// Hence the one rule nothing may break: THIS CAN NEVER FAIL AND NEVER PAY 0.
// It is the only way back into the game from 0 B. A player who cannot finish
// still has to recover, or they are stranded forever with the real game
// permanently out of reach. Skill moves the payout inside a band; it never
// gates access. The band is 40..60, so the best possible player out-earns the
// worst by exactly 1.5x and no more — this is the game's ONLY money faucet, and
// a faucet that scales with skill is an exploit waiting to be found.
//
// As in flip3d/grab.js, the state machine is deliberately separate from any
// pixels: no DOM, no canvas, no rAF. The clock is injectable so the whole thing
// runs in a verifier with no real milliseconds passing — the preview pane here
// is usually hidden, where rAF never fires and setTimeout is throttled, so
// anything driven by a real timer could not be tested at all.
// ---------------------------------------------------------------------------

/** The payout band, in B. Never below the floor, never above the ceiling. */
const PAYOUT_MIN = 40;
const PAYOUT_MAX = 60;

/**
 * Cleaned fraction that counts as finished.
 *
 * Not 1.0. A soft-falloff brush leaves a haze in the corners of the disc that
 * takes as long to chase as the whole rest of the coin, and hunting the last
 * few percent is the least satisfying part of any scrub game. Finishing here
 * pays the full ceiling.
 */
const CLEAN_ENOUGH = 0.92;

/**
 * Hard stop, ms. Twenty seconds, from the brief: longer and the minigame stops
 * being a way back into the game and starts being the game.
 */
const HARD_CAP_MS = 20000;

/** Dirt mask resolution. 64x64 over the coin — 3208 cells inside the disc. */
const DIRT_GRID = 64;

/** Brush radius as a fraction of the coin's radius. */
const BRUSH_RADIUS = 0.16;

/** How much dirt one brush application lifts at its centre, 0..1. */
const BRUSH_STRENGTH = 0.55;

const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);

// --- seeded value noise ----------------------------------------------------
// Integer hash, so the dirt is identical on every machine and every run. A
// float-based PRNG would drift across engines and the "same seed, same dirt"
// guarantee is what makes the generator testable at all.
function hash2(ix, iy, seed) {
  let h = Math.imul(ix | 0, 374761393) + Math.imul(iy | 0, 668265263) + Math.imul(seed | 0, 1274126177);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
}

const fade = (t) => t * t * (3 - 2 * t);

function valueNoise(x, y, seed) {
  const x0 = Math.floor(x); const y0 = Math.floor(y);
  const fx = fade(x - x0); const fy = fade(y - y0);
  const a = hash2(x0, y0, seed); const b = hash2(x0 + 1, y0, seed);
  const c = hash2(x0, y0 + 1, seed); const d = hash2(x0 + 1, y0 + 1, seed);
  return (a + (b - a) * fx) + ((c + (d - c) * fx) - (a + (b - a) * fx)) * fy;
}

/** Layered value noise. Four octaves is enough to read as grime, not as a grid. */
function fbm(x, y, seed) {
  let sum = 0; let amp = 0.5; let f = 1;
  for (let o = 0; o < 4; o++) {
    sum += valueNoise(x * f, y * f, seed + o * 7919) * amp;
    amp *= 0.5; f *= 2;
  }
  return sum;
}

/**
 * Build a dirt mask over the coin.
 *
 * @returns {{grid:number, dirt:Float32Array, inDisc:Uint8Array, discCells:number, total:number}}
 *   `dirt` is 0..1 per cell. Only cells inside the disc are ever counted —
 *   grime drawn outside the coin is not scrubbable and must not dilute the
 *   cleaned fraction, or a player could "finish" by never touching the coin.
 */
function makeDirt(seed = 1, grid = DIRT_GRID) {
  const g = Math.max(4, grid | 0);
  const s = Number.isFinite(seed) ? (seed | 0) : 1;
  const dirt = new Float32Array(g * g);
  const inDisc = new Uint8Array(g * g);
  let discCells = 0; let total = 0;
  for (let j = 0; j < g; j++) {
    for (let i = 0; i < g; i++) {
      const nx = (i + 0.5) / g * 2 - 1;
      const ny = (j + 0.5) / g * 2 - 1;
      const k = j * g + i;
      if (nx * nx + ny * ny > 1) continue;          // outside the coin
      inDisc[k] = 1; discCells++;
      // Bias upward so the coin reads as filthy at the start, but keep the
      // variation — an evenly dirty coin gives the scrub nothing to reveal.
      const v = clamp01(0.35 + fbm((nx + 1) * 3.1, (ny + 1) * 3.1, s) * 1.15);
      dirt[k] = v;
      total += v;
    }
  }
  return { grid: g, dirt, inDisc, discCells, total };
}

/**
 * The payout for a cleaned fraction. Pure, and the single place the band is
 * enforced — everything else routes through here.
 *
 * Normalised to CLEAN_ENOUGH rather than to 1.0, so actually finishing pays the
 * ceiling instead of asymptotically approaching it.
 */
function payoutFor(cleaned) {
  const c = Number.isFinite(cleaned) ? clamp01(cleaned) : 0;
  const q = c >= CLEAN_ENOUGH ? 1 : c / CLEAN_ENOUGH;
  const v = Math.round(PAYOUT_MIN + (PAYOUT_MAX - PAYOUT_MIN) * q);
  // Belt and braces. The arithmetic above cannot leave the band, but this is
  // the value that puts money in a player's wallet and it is worth being
  // certain rather than clever.
  return Math.min(PAYOUT_MAX, Math.max(PAYOUT_MIN, v));
}

/**
 * The scrub.
 *
 * @param {object} [opts]
 * @param {number} [opts.seed] dirt seed
 * @param {number} [opts.grid] mask resolution
 * @param {()=>number} [opts.now] injectable clock, ms
 * @param {number} [opts.brushRadius] fraction of the coin radius
 * @param {number} [opts.hardCapMs]
 */
function createClean(opts = {}) {
  const now = opts.now ?? (() => Date.now());
  const brushRadius = Number.isFinite(opts.brushRadius) && opts.brushRadius > 0
    ? opts.brushRadius : BRUSH_RADIUS;
  const hardCapMs = Number.isFinite(opts.hardCapMs) && opts.hardCapMs > 0
    ? opts.hardCapMs : HARD_CAP_MS;
  const strength = Number.isFinite(opts.strength) && opts.strength > 0
    ? opts.strength : BRUSH_STRENGTH;
  // Test seam, in the spirit of grab.js's _begin/_move/_finish. Set above 1 to
  // disable completion, which is the only way to watch the cleaned fraction run
  // all the way to 1.0 — in the game it finishes at CLEAN_ENOUGH and stops.
  const cleanEnough = Number.isFinite(opts.cleanEnough) ? opts.cleanEnough : CLEAN_ENOUGH;

  let field = makeDirt(opts.seed ?? 1, opts.grid ?? DIRT_GRID);
  let remaining = field.total;
  let startedAt = null;          // null until the first real scrub
  let finished = false;
  let lockedPayout = null;
  let lastX = null; let lastY = null;
  let strokeLen = 0;             // total path length, in coin radii — telemetry

  /** Fraction of the dirt that was there and is now gone. Exactly 1.0 when clear. */
  function cleaned() {
    if (!(field.total > 0)) return 1;
    return clamp01(1 - remaining / field.total);
  }

  function elapsedMs() {
    return startedAt == null ? 0 : Math.max(0, now() - startedAt);
  }

  function finish() {
    if (finished) return;
    finished = true;
    lockedPayout = payoutFor(cleaned());
  }

  /** One brush stamp centred on (nx, ny), coin-normalised to [-1,1]. */
  function stamp(nx, ny) {
    const g = field.grid;
    const r = brushRadius;
    // cell index range the brush can touch
    const lo = (v) => Math.max(0, Math.floor(((v - r) + 1) / 2 * g));
    const hi = (v) => Math.min(g - 1, Math.ceil(((v + r) + 1) / 2 * g));
    const i0 = lo(nx); const i1 = hi(nx); const j0 = lo(ny); const j1 = hi(ny);
    for (let j = j0; j <= j1; j++) {
      for (let i = i0; i <= i1; i++) {
        const k = j * g + i;
        if (!field.inDisc[k]) continue;
        const cx = (i + 0.5) / g * 2 - 1;
        const cy = (j + 0.5) / g * 2 - 1;
        const d = Math.hypot(cx - nx, cy - ny);
        if (d > r) continue;
        const t = 1 - d / r;
        const removal = strength * t * t;        // soft falloff to the rim
        const cur = field.dirt[k];
        if (cur <= 0) continue;
        const took = cur < removal ? cur : removal;
        field.dirt[k] = cur - took;
        remaining -= took;                       // monotone by construction
      }
    }
  }

  /**
   * Scrub to (nx, ny), coin-normalised to [-1,1].
   *
   * Interpolates from the previous point. A fast drag delivers pointer events
   * tens of px apart, and stamping only at the reported positions leaves a
   * dotted trail — the coin looks scrubbed where the hardware happened to
   * sample, which reads as the brush being broken rather than the hand being
   * fast.
   */
  function scrubTo(nx, ny) {
    if (finished) return false;
    if (!Number.isFinite(nx) || !Number.isFinite(ny)) return false;   // broken event
    // THE CLOCK STARTS ON FIRST CONTACT WITH THE COIN, not on the first pointer
    // event. Pressing beside the coin, or dragging onto it from outside, must
    // not quietly burn seconds off a cap the player cannot see — and the cap is
    // the only thing standing between them and a payout.
    if (startedAt == null && nx * nx + ny * ny <= 1) startedAt = now();

    if (lastX == null) {
      stamp(nx, ny);
    } else {
      const dx = nx - lastX; const dy = ny - lastY;
      const dist = Math.hypot(dx, dy);
      strokeLen += dist;
      const step = brushRadius * 0.4;
      const n = Math.min(512, Math.max(1, Math.ceil(dist / step)));
      for (let s = 1; s <= n; s++) stamp(lastX + dx * (s / n), lastY + dy * (s / n));
    }
    lastX = nx; lastY = ny;

    if (cleaned() >= cleanEnough) finish();
    return true;
  }

  /** Lift the brush. The next scrub starts a new stroke rather than joining. */
  function lift() { lastX = null; lastY = null; }

  /**
   * Advance the clock. The ONLY thing that can fire the hard cap, because a
   * player who has stopped scrubbing emits no events.
   */
  function tick() {
    if (finished) return true;
    if (startedAt != null && elapsedMs() >= hardCapMs) finish();
    return finished;
  }

  function reset(seed) {
    field = makeDirt(seed ?? opts.seed ?? 1, opts.grid ?? DIRT_GRID);
    remaining = field.total;
    startedAt = null; finished = false; lockedPayout = null;
    lastX = null; lastY = null; strokeLen = 0;
  }

  return {
    scrubTo, lift, tick, reset, finish,
    get cleaned() { return cleaned(); },
    get done() { return finished; },
    /** Live while scrubbing; frozen the moment it finishes. Always in band. */
    get payout() { return finished ? lockedPayout : payoutFor(cleaned()); },
    get elapsedMs() { return elapsedMs(); },
    get started() { return startedAt != null; },
    /** Path length in coin RADII — how much dragging the clean actually took. */
    get strokeLen() { return strokeLen; },
    get grid() { return field.grid; },
    get discCells() { return field.discCells; },
    /** Dirt at a cell, 0..1, for the view. */
    dirtAt(i, j) {
      const g = field.grid;
      if (i < 0 || j < 0 || i >= g || j >= g) return 0;
      return field.dirt[j * g + i];
    },
    /** The raw mask, for a view that wants to blit it. Read-only by convention. */
    get field() { return field; },
  };
}

// ===== END inlined minigame/clean.js =====

// ---- axis + integer multipliers (derived from true odds) -----------------
// Outcome library EXCLUDES the median value (24), giving N=32 clean outcomes.
const SPIN_MIN=8, SPIN_MAX=40, MEDIAN=24;
const SPIN_VALUES=[]; for(let s=SPIN_MIN;s<=SPIN_MAX;s++){ if(s!==MEDIAN) SPIN_VALUES.push(s); }
const SPIN_N=SPIN_VALUES.length; // 32

// Internally the outcome is an integer half-flip (parity decides the landing
// side). Everything PLAYER-FACING is rotations = half-flips / 2. The two units
// meet only at toRot/toHalf — nowhere else.
const ROT_MIN=SPIN_MIN/2, ROT_MAX=SPIN_MAX/2, ROT_MEDIAN=MEDIAN/2; // 4, 20, 12
const toRot=hf=>hf/2, toHalf=rot=>Math.round(rot*2);

// fair (zero-edge) multipliers. Spin is no longer a constant — it's priced from
// the line you type (see spinMultFor), so only side and direction are fixed.
const MULT = { side:2, orientation:4, edge:499 };

// THE EDGE — the coin lands on its rim. This is COINFLIP's green zero: it sweeps
// the table (side, orientation and spin ALL lose) which is the only thing that
// creates a house edge, and it is uniform across every axis. Priced the way
// roulette prices its zero — N-1 on N, i.e. 499x on a 1-in-500 shot, not 500x —
// so the Edge bet carries exactly the same 0.20% as everything else.
const EDGE_P = 1/500;

// ---- the two presets ------------------------------------------------------
// The Spread SLIDER is gone. It was EV-flat per flip but not over a career, its
// midpoint was near the worst setting, and it collapsed three orthogonal
// questions about the coin onto a single "how long are the odds" axis. In its
// place, two structurally different bets — not two stops on one dial:
//
//   SPREAD  the wallet is split so EVERY call that lands pays the same
//           K x wallet, K = 1 / sum(1/mult). Many small results.
//   RIDE    one compound call. All of it must land, priced on the TRUE joint
//           probability. One huge result, rarely.
//
// The point of the pair is that risk and reward are both legible: each shows
// its chance of paying NOTHING beside its BEST CASE, live, as you build.
let betMode = 'spread';                  // 'spread' | 'ride'

// The outcome space, enumerated exactly: 32 spin values x 4 quadrants, plus the
// rim. 129 atoms is nothing to walk, and walking it is the only honest way to
// price RIDE — because SIDE IS NOT INDEPENDENT OF SPIN. Side is spin parity read
// against the shown start face, so "Heads" and "exactly 10.0 rotations" is one
// call wearing two hats. Multiplying the marginals would post 256x on a bet
// whose true price is 128x, and hand that 2x away every day forever.
const QUADRANTS = ['NE','SE','SW','NW'];
function atomsFor(startFace){
  const out=[], startHeads = startFace==='Heads';
  for(const sp of SPIN_VALUES) for(const q of QUADRANTS)
    out.push({ p:(1-EDGE_P)/(SPIN_N*QUADRANTS.length), spins:sp, quadrant:q,
               side:((sp%2===0)===startHeads)?'Heads':'Tails', edge:false });
  out.push({ p:EDGE_P, edge:true });     // the rim sweeps the table
  return out;
}

async function sha(str){
  const b=await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
const big=(hex,bits=32)=>BigInt('0x'+hex.slice(0,bits/4));

async function resolveFlip(seed){
  const startHeads=(big(await sha('start::'+seed),8)%2n)===0n;
  const idx=Number(big(await sha('spins::'+seed),32)%BigInt(SPIN_N));
  const spins=SPIN_VALUES[idx];
  const landsHeads=(spins%2===0)?startHeads:!startHeads;
  // ORIENTATION = the angle the coin's face is turned to once it settles. It is
  // about the coin itself, never where on the table it came to rest — that axis
  // was deliberately cut. Two decimals: the displayed hundredths ARE the truth.
  // Quadrants are just the coarse buckets the current UI bets on.
  const orientationDeg=Number(big(await sha('orient::'+seed),64)%36000n)/100;   // 0..359.99
  const QUADS=['NE','SE','SW','NW'];
  const quadrant=QUADS[Math.floor(orientationDeg/90)];
  // the rim landing. rare, and it sweeps everything else off the table.
  const edge=(Number(big(await sha('edge::'+seed),64)%100000n)/100000) < EDGE_P;
  return { startFace:startHeads?'Heads':'Tails', side:landsHeads?'Heads':'Tails', spins, orientationDeg, quadrant, edge };
}

// ---- state ---------------------------------------------------------------
// WALLET vs BANK. The wallet is always fully at risk — there is no stake field,
// your stake IS whatever you did not bank. You may bank down to WALLET_FLOOR but
// never below it, so the wallet can only reach 0 by LOSING. That keeps the free
// Broke Flip a safety net for busting rather than a payout you can trigger by
// emptying the wallet on purpose.
// Banking is gated on the cooldown timer: you commit your stake BEFORE the timer
// reaches 00 and cannot change it once the flip is live. So the two are exactly
// exclusive — timer running means bank yes / flip no, timer at 00 means the
// reverse. The preview does NOT auto-start the cooldown after a flip so you can
// keep flipping freely; use the debug buttons to drive the timer by hand.
const WALLET_FLOOR=50;
let timerEnd=0;                                   // epoch ms; 0 or past == "00"
function timerRunning(){ return Date.now() < timerEnd; }
function fmtTimer(){
  if(!timerRunning()) return '00';
  const s=Math.max(0, Math.ceil((timerEnd-Date.now())/1000));
  return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
}

let player=load()||{balance:0,history:[]};
player.bank = player.bank || 0;
let day=player.history.length;
let bet={}; // { side, spins:{line,mode}, orientation }
// The face showing before the flip. RIDE is priced against it, because side is
// spin PARITY read against this face — change it and the joint odds change.
let shownStart='Heads';

function save(){ try{ localStorage.setItem('coinflip', JSON.stringify(player)); }catch{} }
// SANITISE AT THE DOOR. localStorage is not trusted input: it survives across
// versions, it can be hand-edited, and a partial write can leave valid JSON with
// nonsense in it. `{"balance":"lots"}` parses fine, and a string balance passes
// canFlip() — because `"lots" <= 0` is false — then settles to NaN, at which
// point canFlip() AND canClean() are both false and the player is stuck
// permanently with no route back. Measured: one flip from a corrupt save is all
// it takes. Coercing here means every downstream money rule can assume a finite
// non-negative integer, which is what they were all written against anyway.
function money(v){
  const n = Math.floor(Number(v));
  if(!Number.isFinite(n) || n <= 0) return 0;
  // Capped at MAX_SAFE_INTEGER, and not arbitrarily: above it integer
  // arithmetic stops being exact, so B would silently stop being countable.
  // A restored 1e308 is finite and passes every other check, then meets the
  // Edge's 499x and becomes Infinity, and the next arithmetic makes it NaN —
  // the same dead end by a longer road.
  return Math.min(n, Number.MAX_SAFE_INTEGER);
}
function load(){
  try{
    const raw = JSON.parse(localStorage.getItem('coinflip'));
    if(!raw || typeof raw !== 'object') return null;
    return {
      balance: money(raw.balance),
      bank: money(raw.bank),
      history: Array.isArray(raw.history) ? raw.history : [],
    };
  }catch{ return null; }
}
const $=s=>document.querySelector(s);

// ---- refresh / coin ------------------------------------------------------
// you choose the amount; the cap is whatever sits above the floor
function bankMax(){ return Math.max(0, Math.round(player.balance) - WALLET_FLOOR); }
// ALSO refused while a flip is in flight. The design's own rule is that the
// stake is frozen once the flip goes live, but only canFlip() enforced it, and
// only against the timer — so the moment a cooldown began during a reveal
// (three seconds of animation, and the debug button can do it today) banking
// re-opened mid-settlement. doFlip captures the stake, awaits the reveal, then
// re-reads the balance: bank 500 of a 1000 wallet during that window and the
// settlement computes 500 - 1000 + returned, landing the player on a NEGATIVE
// wallet with 500 destroyed. Measured before this line existed.
function canBank(){ return bankMax()>0 && timerRunning() && !flipping; }
function doBank(){
  // enforce the gate in LOGIC, not just CSS — pointer-events:none stops a mouse
  // click but not Enter in the field, so the rule has to hold here too
  if(!canBank()) return;
  const max=bankMax(); if(max<=0) return;
  let amt=Math.floor(parseFloat($('#bankInput').value)||0);
  if(amt<=0) return;
  amt=Math.min(amt, max);                           // never breach the floor
  player.bank += amt; player.balance -= amt; save();
  $('#bankInput').value='';
  refresh({keep:true});
}
function syncMoney(){
  $('#bal').textContent=Math.round(player.balance).toLocaleString('en-US');
  $('#bankAmt').textContent=Math.round(player.bank).toLocaleString('en-US');
  const max=bankMax();
  $('#bankInput').max=max;
  $('#bankInput').placeholder=max;                  // shows the cap without extra copy
  $('#bankCtl').classList.toggle('off', !canBank());
  $('#stake').textContent=Math.round(player.balance).toLocaleString('en-US');  // the wallet IS the stake
}

async function refresh(opts){
  syncMoney();
  updateFinal();
  updateFlipLock();
  if(opts && opts.keep) return;   // balance only — board stays exactly as it is
  const broke=player.balance<=0;
  $('#brokeScreen').style.display=broke?'block':'none';
  $('#form').style.display=broke?'none':'block';
  $('#betbar').style.display=broke?'none':'flex';
  const start=await previewStart();
  shownStart=start;                 // RIDE's joint odds are priced against it
  if(broke){
    // A fresh coin, freshly filthy. Seeded off the day so reloading the page
    // does not reroll the dirt into something easier — the seed is the only
    // thing standing between a scrub and a re-roll-until-it-is-quick exploit.
    startClean();
    updateBrokeLock();
  }
  else { renderCoin(start); setCounter(0); }
  if(!broke) resetForm();
}
async function previewStart(){ const h=await sha('start::preview::day'+day); return (big(h,8)%2n===0n)?'Heads':'Tails'; }
function renderCoin(face, sel='#coinVis'){
  $(sel).innerHTML=`<div class="coin${face==='Tails'?' tails':''}"><div class="face front">HEADS</div><div class="face back">TAILS</div></div>`;
}
function setCounter(v, sel='#spinCounter'){ const el=$(sel); if(el) el.textContent='spin: '+v.toFixed(1); }

// ---- busker mode: the scrub ------------------------------------------------
// The state machine is minigame/clean.js, inlined above. Everything here is
// pixels and pointers — the same split flip3d/grab.js uses, and the reason the
// payout can be verified with no DOM at all.
let clean=null;
let cleanDown=false;
let cleanMask=null, cleanImg=null;

/**
 * A fresh dirty coin. Seeded off the DAY, so a reload cannot reroll the dirt.
 *
 * THE STATE MACHINE IS CREATED UNCONDITIONALLY; only the pixels are optional.
 * That split is not tidiness — `clean` is what pays the player, and a canvas
 * that failed to initialise must never be able to take the money with it. It
 * also means the whole payout path runs in a verifier with no canvas at all,
 * which is the only way it can be tested here.
 */
function startClean(){
  clean=createClean({ seed: (day*2654435761 + 12345) | 0 });
  cleanDown=false;
  cleanMask=null; cleanImg=null;
  const g=clean.grid;
  const m=document.createElement('canvas');
  const mctx=m && typeof m.getContext==='function' ? m.getContext('2d') : null;
  if(mctx && typeof mctx.createImageData==='function'){
    m.width=m.height=g;
    cleanMask=m; cleanImg=mctx.createImageData(g,g);
  }
  renderClean();
}

function drawCleanCoin(ctx,cx,cy,r){
  const g=ctx.createRadialGradient(cx-r*0.35, cy-r*0.4, r*0.1, cx, cy, r);
  g.addColorStop(0,'#e6e7ea'); g.addColorStop(0.55,'#bfc1c7'); g.addColorStop(1,'#8e9199');
  ctx.fillStyle=g; ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.lineWidth=r*0.055; ctx.strokeStyle='#7d8089';
  ctx.beginPath(); ctx.arc(cx,cy,r*0.965,0,Math.PI*2); ctx.stroke();
  ctx.lineWidth=r*0.018; ctx.strokeStyle='#9fa2aa';
  ctx.beginPath(); ctx.arc(cx,cy,r*0.86,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle='#83868f'; ctx.lineWidth=r*0.02;
  for(let i=0;i<90;i++){
    const a=(i/90)*Math.PI*2;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*r*0.975, cy+Math.sin(a)*r*0.975);
    ctx.lineTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r);
    ctx.stroke();
  }
  ctx.strokeStyle='#82858e'; ctx.lineWidth=r*0.035; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(cx-r*0.1, cy-r*0.26); ctx.lineTo(cx+r*0.02, cy-r*0.36);
  ctx.lineTo(cx+r*0.02, cy+r*0.3); ctx.stroke();
  ctx.lineWidth=r*0.022;
  ctx.beginPath(); ctx.arc(cx,cy,r*0.6, Math.PI*0.75, Math.PI*0.25); ctx.stroke();
}

function renderClean(){
  if(!clean) return;
  // The readout is the one part that is not pixels, so it updates even where
  // there is no canvas to draw on.
  const res=$('#brokeResult');
  if(res && !clean.done){ res.textContent=clean.payout+' ₿'; res.style.color='#9a9a9a'; }

  const cv=$('#cleanCoin'); if(!cv || typeof cv.getContext!=='function') return;
  const ctx=cv.getContext('2d'); if(!ctx || !cleanMask || !cleanImg) return;
  const w=cv.width, h=cv.height, cx=w/2, cy=h/2, r=Math.min(w,h)*0.44;
  ctx.clearRect(0,0,w,h);
  drawCleanCoin(ctx,cx,cy,r);
  // the mask is drawn at grid resolution and scaled up — letting the browser
  // smooth it is what turns a grid of numbers into grime rather than pixel art
  const g=clean.grid, d=cleanImg.data;
  for(let j=0;j<g;j++) for(let i=0;i<g;i++){
    const k=j*g+i, v=clean.dirtAt(i,j);
    d[k*4]=58; d[k*4+1]=47; d[k*4+2]=34;
    d[k*4+3]=Math.round(Math.min(1,v)*236);
  }
  cleanMask.getContext('2d').putImageData(cleanImg,0,0);
  ctx.save();
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.clip();
  ctx.imageSmoothingEnabled=true;
  ctx.drawImage(cleanMask, cx-r, cy-r, r*2, r*2);
  ctx.restore();
}

/** Client px -> coin-normalised [-1,1]. */
function cleanCoords(ev){
  const cv=$('#cleanCoin'), b=cv.getBoundingClientRect();
  const r=Math.min(b.width,b.height)*0.44;
  return [(ev.clientX-(b.left+b.width/2))/r, (ev.clientY-(b.top+b.height/2))/r];
}

function cleanScrub(ev){
  // Gated in LOGIC. pointer-events:none stops a mouse but not a synthetic event
  // or a stray touch, and this is the path that mints the game's only money.
  if(!clean || !canClean() || flipping) return;
  const [x,y]=cleanCoords(ev);
  clean.scrubTo(x,y);
  renderClean();
  if(clean.done) cleanPayout();
}

// animate a lite flip: swap heads/tails in succession, one swap per half-flip,
// ticking the spin counter by 0.5 each swap, landing on flip.side at flip.spins.
// displayed spin value = half-flips / 2 (full rotations, e.g. 19 half-flips = 9.5)
function playFlip(flip, coinSel='#coinVis', counterSel='#spinCounter'){
  return new Promise(resolve=>{
    const halfFlips=flip.spins;            // integer 8–40
    let curHeads=(flip.startFace==='Heads');
    renderCoin(flip.startFace, coinSel);
    setCounter(0, counterSel);
    let i=0;
    const delayAt=k=>{
      const t=k/halfFlips;                 // 0..1 progress
      return 60 + Math.pow(t,3)*260;       // 60ms → ~320ms near the end
    };
    function step(){
      const c=$(coinSel+' .coin');
      curHeads=!curHeads;                  // one half-flip = one face swap
      if(c) c.classList.toggle('tails', !curHeads);
      i++;
      setCounter(i/2, counterSel);         // +0.5 per half-flip
      if(i>=halfFlips){
        if(c) c.classList.toggle('tails', flip.side!=='Heads');
        setCounter(halfFlips/2, counterSel);
        setTimeout(resolve, 300);
        return;
      }
      setTimeout(step, delayAt(i));
    }
    setTimeout(step, delayAt(0));
  });
}

// ---- vertical form: reveal + lock as you go ------------------------------
// aspect order: side(0) -> spins(1) -> direction(2) -> stake
// Pattern: click a text option; the UNPICKED siblings fade out, the picked one
// stays in place as the greyed record. The aspect greys (.locked) and shows mult.
function resetForm(){
  clearReveal();
  bet={};
  ['side','orient'].forEach(k=>unlockChoices(k));
  unlockChoices('spins');
  hideAspect('spins'); hideAspect('orient');
  $('#spinLine').value=''; updateDeadSides(NaN); clearDial();
  hideAspect('spread');
  betMode='spread';            // default: split it. RIDE is the deliberate choice.
  updateRail(0);
  updateFinal();
}
function unlockChoices(suffix){
  const a=$('#a-'+suffix);
  a.classList.remove('locked');
  a.querySelectorAll('.opt').forEach(o=>o.classList.remove('on','dead'));
  $('#m-'+suffix).textContent='';
}
function lockAspect(suffix, mult){
  $('#a-'+suffix).classList.add('locked');
  $('#m-'+suffix).classList.remove('hidden');
  $('#m-'+suffix).textContent=fmtMult(mult)+'×';   // right column = this row's multiplier
}
// Selection is COLOUR, not disappearance: the pick goes blue, its siblings stay
// grey and readable so you can always see what else was on offer.
function selectOne(groupSel, chosenEl){
  document.querySelectorAll(groupSel+' .opt').forEach(o=>o.classList.toggle('on', o===chosenEl));
}
function revealAspect(suffix){
  $('#a-'+suffix).classList.remove('hidden');
  if(suffix==='spread') return;                  // the spread row carries no dot
  const idx = suffix==='orient'?1 : suffix==='spins'?2 : suffix==='side'?0 : 3;
  dotOf(idx)?.classList.remove('hidden');
}
function hideAspect(suffix){
  $('#a-'+suffix).classList.add('hidden');
  $('#m-'+suffix).classList.add('hidden');
  if(suffix==='spread') return;
  const idx = suffix==='orient'?1 : suffix==='spins'?2 : suffix==='side'?0 : 3;
