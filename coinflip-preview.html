}
function dotOf(idx){ return document.querySelector('.dot[data-idx="'+idx+'"]'); }

function updateRail(currentIdx){
  document.querySelectorAll('.dot').forEach(dot=>{
    const i=+dot.dataset.idx;
    dot.classList.remove('current','clickable');
    if(i===currentIdx) dot.classList.add('current');
    else if(isChosen(i)) dot.classList.add('clickable');
  });
}
function isChosen(i){ return i===0?!!bet.side : i===1?!!bet.orientation : i===2?!!bet.spins : false; }

// SIDE
document.querySelectorAll('#side-choices .pick').forEach(b=>{
  b.addEventListener('click', ()=>{
    bet.side=b.dataset.val;
    selectOne('#side-choices', b);
    lockAspect('side', sideMult());
    revealAspect('orient'); revealAspect('spins'); revealAspect('spread');
    // Edge takes the whole stake, so the other axes go inert
    const allIn = bet.side==='Edge';
    if(allIn){ bet.orientation=undefined; bet.spins=undefined; clearDial();
               unlockChoices('orient'); $('#spinLine').value=''; syncSpins(); }
    ['orient','spins','spread'].forEach(k=>$('#a-'+k).classList.toggle('void', allIn));
    updateRail(1); updateFinal();
  });
});

// SPINS — the typed line IS the bet. Alone it's an exact call (32×). Adding
// "higher"/"lower" widens it to every outcome above/below that line: safer, so
// the multiplier drops. Multiplier is always poolSize / winning-outcomes, i.e.
// the fair price of whatever you just covered — one rule for all three shapes.
function spinPool(){ return SPIN_VALUES.map(toRot); }   // 32 values, in rotations
function countFor(line, mode, pool){
  return mode==='gt' ? pool.filter(x=>x>line).length
       : mode==='lt' ? pool.filter(x=>x<line).length
       :               pool.filter(x=>x===line).length;
}
// 0 means the bet covers nothing and can never win (line at either extreme).
function spinMultFor(line, mode, pool=spinPool()){
  const c=countFor(line, mode, pool);
  return c ? pool.length/c : 0;
}
// lines are ROTATIONS: any half-rotation step in 4..20; 12 is unattainable.
//
// ACCEPT ANY SPELLING OF A HALF STEP. This used to be /^\d+(\.5)?$/, which
// rejected "10.0" — the exact string the game puts on screen. The live counter
// reads "spin: 10.0" and a lost line reports "10.0", so the player reads a
// value off the display, types it straight back, and gets silence: no
// multiplier, no bet, and nothing saying why. A validator that refuses the
// program's own output format is never the player's mistake.
function validLine(s){
  if(!/^\d+(\.\d+)?$/.test(s)) return false;
  const v=parseFloat(s);
  if(!Number.isFinite(v)) return false;
  if(Math.abs(v*2-Math.round(v*2))>1e-9) return false;   // must land on a half step
  const r=Math.round(v*2)/2;
  return r>=ROT_MIN && r<=ROT_MAX && r!==ROT_MEDIAN;
}
// the canonical half-step the typed text means, so 10.00 and 10.0 are one line
function lineValue(s){ return Math.round(parseFloat(s)*2)/2; }
function spinMode(){ return document.querySelector('#spins-choices .pick2.on')?.dataset.val || 'exact'; }
function clearSpins(){
  bet.spins=undefined;
  unlockChoices('spins');
  $('#m-spins').textContent='';
  updateRail(2); updateFinal();
}
// a line at either end leaves one modifier covering nothing — block it outright
function updateDeadSides(line){
  document.querySelectorAll('#spins-choices .pick2').forEach(b=>{
    const dead = !isNaN(line) && spinMultFor(line, b.dataset.val)===0;
    b.classList.toggle('dead', dead);
    if(dead) b.classList.remove('on');
  });
}
// live: a valid line commits the bet as you type; modifiers refine it
function syncSpins(){
  if($('#a-spins').classList.contains('void')){ bet.spins=undefined; return; }
  const raw=$('#spinLine').value.trim();
  if(!validLine(raw)){
    bet.spins=undefined; updateDeadSides(NaN);
    $('#a-spins').classList.remove('locked'); $('#m-spins').textContent='';
    updateRail(2); updateFinal(); return;
  }
  const line=lineValue(raw);
  updateDeadSides(line);
  const mode=spinMode();
  bet.spins={line, mode};
  lockAspect('spins', spinMultFor(line, mode));
  updateRail(2); updateFinal();
}
document.querySelectorAll('#spins-choices .pick2').forEach(b=>{
  b.addEventListener('click', ()=>{
    if(b.classList.contains('dead')) return;
    const wasOn=b.classList.contains('on');
    document.querySelectorAll('#spins-choices .pick2').forEach(o=>o.classList.remove('on'));
    if(!wasOn) b.classList.add('on');   // clicking the active one drops back to exact
    syncSpins();
  });
});
// picking a preset re-prices the whole board, so the Total updates live
document.querySelectorAll('#a-spread .mode').forEach(b=>{
  b.addEventListener('click', ()=>{
    if($('#a-spread').classList.contains('void')) return;
    if(b.classList.contains('dead')) return;
    betMode = b.dataset.mode;
    updateFinal();
  });
});

$('#spinLine').addEventListener('input', syncSpins);
$('#spinLine').addEventListener('keydown', e=>{
  if(e.key!=='Enter') return;
  e.preventDefault();
  if(bet.spins) $('#spinLine').blur();   // nothing to advance to — the stake is fixed
});

// DIRECTION — multi-select: toggle any number of quadrants, multiplier is live.
// fair multiplier = 4 / (quadrants selected); 0 or 4 selected = no upgrade (1×)
function orientSel(){ return bet.orientation || []; }
function orientMult(){ const k=orientSel().length; return (k===0||k===4) ? 1 : 4/k; }
function fmtMult(m){ return Number.isInteger(m) ? m : Math.round(m*100)/100; }

// Drag to paint. The first quadrant you press sets the mode for the whole hold —
// press an unlit one and you're filling in, press a lit one and you're wiping out
// — and everything you swipe across gets that same treatment. Retracing does NOT
// undo (tried it; a stroke that erases itself feels worse than one that commits).
// A plain click is just a drag of length zero, so single-toggling still works.
let painting=null;                       // null | true (filling) | false (wiping)
function setQuad(d, on){
  const sel=orientSel().slice();
  const at=sel.indexOf(d);
  if(on && at<0) sel.push(d);
  else if(!on && at>=0) sel.splice(at,1);
  else return;                           // already in the wanted state
  bet.orientation = sel.length ? sel : undefined;
  renderDial();
  updateOrientMults();
}
document.querySelectorAll('#dial .quad').forEach(p=>{
  const d=p.dataset.quad;
  p.addEventListener('mouseenter', ()=>{ if(painting===null && !orientSel().includes(d)) p.style.transform='scale(1.12)'; });
  p.addEventListener('mouseleave', ()=>{ if(painting===null && !orientSel().includes(d)) p.style.transform='scale(1)'; });
  p.addEventListener('pointerdown', e=>{
    if($('#a-orient').classList.contains('void')) return;   // Edge owns the whole stake
    e.preventDefault();
    painting = !orientSel().includes(d);
    setQuad(d, painting);
  });
  p.addEventListener('pointerenter', ()=>{
    if(painting===null) return;
    if($('#a-orient').classList.contains('void')) return;
    setQuad(d, painting);
  });
});
window.addEventListener('pointerup', ()=>{ painting=null; });
window.addEventListener('pointercancel', ()=>{ painting=null; });
// Adjacent pairs sit either side of a cross line, so together they ARE that
// cardinal direction — two diagonals become one arrow on their shared edge.
// Opposite pairs (N+S, E+W) share no edge and keep their own arrows.
const MERGE={           // keys are the two quadrant names sorted and joined
  NENW:{deg:0,   x:80, y:35 },   // NE + NW = up    = N
  NESE:{deg:90,  x:125,y:80 },   // NE + SE = right = E
  SESW:{deg:180, x:80, y:125},   // SE + SW = down  = S
  NWSW:{deg:270, x:35, y:80 },   // NW + SW = left  = W
};
function renderArrows(sel){
  const S=new Set(sel);
  let merged=null; const hide=new Set();
  const tryMerge=(a,b)=>{
    if(!(S.has(a)&&S.has(b))) return false;
    merged=MERGE[[a,b].sort().join('')]; hide.add(a); hide.add(b); return true;
  };
  // A selected adjacent pair collapses to its cardinal. With three quadrants
  // there is always exactly one complete horizontal side (NE+SE or NW+SW) —
  // merge that, and the odd quadrant keeps its own diagonal. So NE+SE+NW reads
  // as a right arrow plus the lone NW diagonal.
  if(sel.length===2) tryMerge('NE','SE')||tryMerge('SE','SW')||tryMerge('SW','NW')||tryMerge('NW','NE');
  else if(sel.length===3) tryMerge('NE','SE')||tryMerge('NW','SW');
  document.querySelectorAll('#dial-arrows [data-arrow]').forEach(g=>{
    g.style.display = hide.has(g.dataset.arrow) ? 'none' : '';
  });
  const el=$('#dial-merged');
  if(merged){ el.setAttribute('transform','translate('+merged.x+','+merged.y+') rotate('+merged.deg+')'); el.style.display=''; }
  else el.style.display='none';
}
function renderDial(){
  const sel=orientSel();
  document.querySelectorAll('#dial .quad').forEach(p=>{
    const on=sel.includes(p.dataset.quad);
    p.setAttribute('fill', on?'#9ec1f5':'transparent');   // --sel-soft; selected reads blue
    p.style.transform = on?'scale(1.12)':'scale(1)';
  });
  renderArrows(sel);
}
function clearDial(){
  document.querySelectorAll('#dial .quad').forEach(p=>{ p.setAttribute('fill','transparent'); p.style.transform='scale(1)'; });
  renderArrows([]);
}
// direction upgrades the SIDE bet, so both rows update together
function updateOrientMults(){
  const k=orientSel().length;
  if(k>0){ $('#a-orient').classList.add('locked'); $('#m-orient').classList.remove('hidden'); $('#m-orient').textContent=fmtMult(orientMult())+'×'; }
  else { $('#a-orient').classList.remove('locked'); $('#m-orient').textContent=''; }
  updateFinal(); updateRail(1);
}

// rail click -> revise a chosen aspect (unlock it and everything after)
document.querySelectorAll('.dot').forEach(dot=>{
  dot.addEventListener('click', ()=>{
    const i=+dot.dataset.idx;
    if(!isChosen(i)) return;
    reviseFrom(i);
  });
});
function reviseFrom(i){
  // order: 0=Side, 1=Orientation, 2=Spins. Clear this step + all later, reopen this one.
  if(i<=0){
    bet.side=undefined; unlockChoices('side');
  }
  if(i<=1){
    bet.orientation=undefined; clearDial();
    if(bet.side) lockAspect('side', sideMult());
    if(i===1){ unlockChoices('orient'); }   // reopen direction
    else { hideAspect('orient'); }
  }
  if(i<=2){
    bet.spins=undefined; $('#spinLine').value=''; updateDeadSides(NaN);
    if(i===2){ unlockChoices('spins'); } // reopen spins
    else { hideAspect('spins'); }
  }
  if(i===0) hideAspect('spread');
  updateRail(i); updateFinal();
}

// ---- itemization + multiplier display ------------------------------------

// ---- resolve + flip ------------------------------------------------------
// THREE INDEPENDENT BETS, each resolving on its own. Orientation does NOT
// multiply Side, and Spin is not a fixed pair of values — it's priced from the
// line you type. (Both of those are superseded models; do not reintroduce them.)
// Edge is the coin's third side, so it lives in the Side row and is priced there
function sideMult(){ return bet.side==='Edge' ? MULT.edge : MULT.side; }
function spinsMult(){ return !bet.spins ? 0 : spinMultFor(bet.spins.line, bet.spins.mode); } // priced from the line

// The entered amount IS the total risk and SPLITS evenly across the bets placed
// (3 bets, 100 entered -> 33.33 each), so the Total × is the AVERAGE of the row
// multipliers, never the sum.
// The calls actually on the board. Edge takes the whole wallet and locks the
// other axes out, so it is its own board of one.
function placedBets(){
  if(bet.side==='Edge') return [{ key:'side', mult:MULT.edge }];
  const list=[];
  if(bet.side)            list.push({ key:'side',   mult:sideMult() });
  if(orientSel().length)  list.push({ key:'orient', mult:orientMult() });
  if(bet.spins)           list.push({ key:'spins',  mult:spinsMult() });
  // A 1x "bet" hands the wallet straight back whatever the coin does — covering
  // all four quadrants is a refund, not a wager, so it never takes a share.
  return list.filter(x=>x.mult>1);
}

// SPREAD. Weights go as 1/mult, which is the ONLY split where every call that
// lands pays the same: back a 32x line with a sliver and a 2x call with the
// bulk, sized so both come home identical. K is that shared payout.
//   K = 1 / sum(1/mult)
// It also removes "right but poorer" wherever K >= 1 — with an even split,
// calling the coin correctly LOST you a third of the wallet 36% of the time,
// because the long shot you also placed ate the rest.
function spreadWeights(mults){
  const inv=mults.map(m=>1/m), t=inv.reduce((a,b)=>a+b,0);
  return inv.map(v=>v/t);
}
function spreadK(){
  const b=placedBets();
  return b.length ? 1/b.map(x=>1/x.mult).reduce((a,c)=>a+c,0) : 0;
}

// RIDE. One compound call, priced on the true joint probability of every placed
// call landing together — NOT the product of their multipliers. The rim is left
// out of the pricing on purpose: it sweeps the table, and that sweep IS the
// house edge, so leaving it out here keeps RIDE on the same uniform 0.20%.
function rideProb(){
  const b=placedBets();
  if(!b.length) return 0;
  if(bet.side==='Edge') return EDGE_P;
  let n=0;
  for(const a of atomsFor(shownStart)){
    if(a.edge) continue;
    if(b.every(x=>winOf(x,a))) n++;
  }
  return n/(SPIN_N*QUADRANTS.length);
}
function rideMult(){
  if(bet.side==='Edge') return MULT.edge;
  const p=rideProb();
  return p>0 ? 1/p : 0;
}

// What each preset is actually offering, in the two numbers that matter: how
// often it pays NOTHING, and the best it can do. The ladder this replaced showed
// only the second, so being more specific read as a free upgrade.
function modeStats(){
  const b=placedBets();
  if(!b.length) return null;
  let sNothing=0, rNothing=0;
  for(const a of atomsFor(shownStart)){
    const hits=b.map(x=>winOf(x,a));
    if(!hits.some(Boolean)) sNothing+=a.p;
    if(!hits.every(Boolean)) rNothing+=a.p;
  }
  return { spread:{ nothing:sNothing, best:spreadK()*b.length },
           ride:{   nothing:rNothing, best:rideMult() } };
}

function portions(){
  const b=placedBets();
  if(!b.length) return [];
  if(betMode==='ride'){ b.forEach(x=>{ x.w=0; }); return b; }
  const w=spreadWeights(b.map(x=>x.mult));
  b.forEach((x,i)=>{ x.w=w[i]; });
  return b;
}
// a rim landing sweeps the table — the only thing that can win is calling Edge
function winOf(x, flip){
  if(x.key==='side') return resolveSide(flip);
  if(flip.edge) return false;
  return x.key==='orient' ? resolveOrient(flip) : resolveSpins(flip);
}
// the actual B riding on each line. RIDE has no split, so it shows none.
function syncAmounts(p){
  const stake=player.balance;
  const by=Object.fromEntries(p.map(x=>[x.key, x.w*stake]));
  [['side','#amt-side'],['orient','#amt-orient'],['spins','#amt-spins']].forEach(([k,sel])=>{
    const el=$(sel); if(!el) return;
    el.textContent = (betMode==='ride' || by[k]===undefined)
      ? '' : '₿ '+Math.round(by[k]).toLocaleString('en-US');
  });
}
function updateFinal(){
  const p=portions();
  syncAmounts(p);
  const st=modeStats();
  document.querySelectorAll('#a-spread .mode').forEach(el=>{
    el.classList.toggle('on', el.dataset.mode===betMode);
  });
  const show=(sel,d)=>{
    const el=$(sel); if(!el) return;
    el.textContent = d ? 'nothing '+Math.round(d.nothing*100)+'%   best '
      + Math.round(d.best*player.balance).toLocaleString('en-US')+' ₿' : '';
  };
  // A RIDE can be built that cannot possibly land: side IS spin parity, so
  // calling Heads next to an odd-rotation line asks the coin to do two
  // contradictory things. Half of all side + exact-spin pairings are dead this
  // way. Grey it out rather than letting someone spend their one daily flip on
  // an unwinnable bet — same treatment the dead higher/lower modifiers get.
  const rideDead = !!st && st.ride.best===0;
  const rideEl = document.querySelector('#a-spread .mode[data-mode="ride"]');
  if(rideEl) rideEl.classList.toggle('dead', rideDead);
  if(rideDead && betMode==='ride'){ betMode='spread';
    document.querySelectorAll('#a-spread .mode').forEach(el=>
      el.classList.toggle('on', el.dataset.mode==='spread')); }
  show('#stat-spread', st && st.spread);
  show('#stat-ride',   st && st.ride);
  if(!p.length){ $('#finalMult').textContent='0'; updateFlipLock(); return; }
  $('#finalMult').textContent = fmtMult(betMode==='ride' ? rideMult() : spreadK());
  updateFlipLock();
}
function resolveSide(flip){
  return bet.side==='Edge' ? !!flip.edge : (!flip.edge && bet.side===flip.side);
}
function resolveOrient(flip){ return orientSel().includes(flip.quadrant); }
// ---- staged result reveal -------------------------------------------------
const wait=ms=>new Promise(r=>setTimeout(r,ms));

// How much ceremony a single line's move has earned. Duration and pulse were
// fixed, so a +0.9 nudge (1.03× line) got the same 700ms and 16% swell as a
// +930 exact hit. Magnitude is measured against the STAKE rather than the
// multiplier, so the stake split is accounted for: 32× on a third of the stake
// and 32× as your only bet both read as huge, correctly.
// Log-normalised — the magnitude range spans ~3 orders of magnitude, and a
// linear ramp would flatten everything below ~5× into one indistinguishable blur.
const DRAMA={ mMin:0.01, mMax:31, durMin:260, durMax:1100, pulseMin:0.04, pulseMax:0.28 };
function dramaOf(delta, stake){
  const m = stake>0 ? Math.abs(delta)/stake : 0;
  const lo=Math.log(DRAMA.mMin), hi=Math.log(DRAMA.mMax);
  const k = Math.min(1, Math.max(0, (Math.log(Math.max(m, DRAMA.mMin))-lo)/(hi-lo)));
  return { ms: DRAMA.durMin + k*(DRAMA.durMax-DRAMA.durMin),
           pulse: DRAMA.pulseMin + k*(DRAMA.pulseMax-DRAMA.pulseMin),
           // the fixed per-row choreography dominated the reveal (520 slide + 160
           // + 320 tail = 1s a row regardless), so scale it by weight too
           scale: 0.45 + k*0.75 };
}

// Scoring colour is a GRADIENT, not a binary. Saturation tracks distance from
// break-even: level with the stake is neutral grey, and it reaches full strength
// at a whole stake won or lost — running = 2×stake, or running = 0. Past that it
// clamps, so a 32× hit is simply full green rather than something louder.
const C_WIN=[26,158,63], C_LOSS=[209,45,45], C_LEVEL=[154,154,154], C_EDGE=[139,74,214];
function positionColour(value, stake, isEdge){
  if(!(stake>0)) return '';
  const t=(value-stake)/stake;                    // profit, in units of the stake
  const s=Math.min(1, Math.abs(t));
  const to = t>=0 ? (isEdge?C_EDGE:C_WIN) : C_LOSS;   // a rim landing reads purple, never green
  return 'rgb('+C_LEVEL.map((n,i)=>Math.round(n+(to[i]-n)*s)).join(',')+')';
}

// slot-machine count-up in the Total row; number grows as it climbs, by weight,
// and deepens in colour as it pulls away from break-even
function countUp(from, to, ms, pulse=0.16, stake=0, isEdge=false){
  return new Promise(res=>{
    const el=$('#stepTotal');
    const t0=performance.now();
    requestAnimationFrame(function step(now){
      const t=Math.min(1,(now-t0)/ms);
      const e=1-Math.pow(1-t,3);
      const v=from+(to-from)*e;
      el.textContent='₿ '+Math.round(v).toLocaleString('en-US');
      el.style.color=positionColour(v, stake, isEdge);
      el.style.transform='scale('+(1+pulse*Math.sin(t*Math.PI))+')';
      if(t<1) requestAnimationFrame(step);
      else { el.style.transform='scale(1)'; res(); }
    });
  });
}

// mark a text option win/loss — res-* colours override the blue selection
function markOpt(el, won){
  if(!el) return;
  el.classList.add(won?'res-win':'res-loss');
}

const amtCell = key => key==='side' ? '#amt-side' : key==='orient' ? '#amt-orient' : '#amt-spins';
async function revealResults(flip, stake, p){
  const tot=$('#stepTotal');
  let running=stake;                    // starts at the WHOLE bet, then moves per line
  let alive=true;                       // RIDE only: still in it
  // sit in the amount column, in line with the per-row ₿ values — the running
  // total IS the center-column number now, not a separate centred readout
  tot.style.left=($('#stake').closest('.row-amt').offsetLeft)+'px';
  tot.style.opacity='0';
  tot.style.visibility='visible';
  tot.textContent='₿ '+Math.round(running).toLocaleString('en-US');
  tot.style.color=positionColour(running, stake, flip.edge);   // starts level, so neutral grey

  for(const x of p){
    const perBet=x.w*stake;             // this line's share, set by the spread slider
    const row = x.key==='side' ? '#a-side' : x.key==='orient' ? '#a-orient' : '#a-spins';
    const rowEl=$(row);
    $(amtCell(x.key))?.classList.add('amt-hidden');   // the moving number replaces this row's static ₿

    // weight the WHOLE beat, not just the count-up: a line that barely moves the
    // money gets a quick slide and a short tail, a big hit gets room to breathe
    const won=winOf(x, flip);
    const delta = won ? perBet*(x.mult-1) : -perBet;
    const d = dramaOf(delta, stake);
    const slide=Math.round(520*d.scale), gap=Math.round(160*d.scale), tail=Math.round(320*d.scale);

    // slide the readout down to this row, carrying the running total with it
    tot.style.transitionDuration=slide+'ms, '+slide+'ms, 300ms';   // top, left, opacity
    tot.style.top=(rowEl.offsetTop)+'px';
    tot.style.opacity='1';
    rowEl.classList.add('step-live');
    await wait(slide);                     // let the slide land

    if(x.key==='side'){
      // only the CORRECT value grows; a wrong pick just turns red. Edge reads purple.
      const picked=document.querySelector('#side-choices .pick[data-val="'+bet.side+'"]');
      if(picked) picked.classList.add(won ? (bet.side==='Edge'?'res-edge':'res-win') : 'res-loss');
      if(!won){
        const truth = flip.edge ? 'Edge' : flip.side;
        const el=document.querySelector('#side-choices .pick[data-val="'+truth+'"]');
        if(el) el.classList.add(flip.edge?'res-edge':'res-win');
      }
    } else if(x.key==='orient'){
      document.querySelectorAll('#dial .quad').forEach(q=>{ q.style.transform=''; });
      orientSel().forEach(d=>{
        const q=document.querySelector('#dial .quad[data-quad="'+d+'"]');
        if(q && (flip.edge || d!==flip.quadrant)) q.classList.add('res-loss');
      });
      if(!flip.edge){
        const hit=document.querySelector('#dial .quad[data-quad="'+flip.quadrant+'"]');
        if(hit){ hit.classList.remove('res-loss'); hit.classList.add('res-win'); }
      }
    } else {
      // the typed line is the pick — only it scales, and only when correct
      $('#lineWrap').classList.add(won?'res-win':'res-loss');
      const modeEl=document.querySelector('#spins-choices .pick2.on');
      if(modeEl) markOpt(modeEl, won);
      if(!won && !flip.edge){         // on a loss, show where it actually landed
        const el=$('#spinLanded');
        el.textContent=toRot(flip.spins).toFixed(1);
        el.style.visibility='visible';
      }
    }

    // the ROW multiplier still reports that line's own result — that part is right
    const mcell = x.key==='side' ? '#m-side' : x.key==='orient' ? '#m-orient' : '#m-spins';
    $(mcell).classList.add(won ? (bet.side==='Edge'&&x.key==='side' ? 'res-edge':'res-win') : 'res-loss');

    // RIDE is one compound call, so the money does not move per line. It holds
    // at the whole stake while the calls come in, and dies the instant one
    // misses — the remaining rows still resolve, so you always see what the coin
    // actually did, but you already know you are out. That beat, watching the
    // rows keep landing after you are dead, is the point of riding.
    if(betMode==='ride'){
      if(!won && alive){
        alive=false;
        await wait(gap);
        await countUp(running, 0, d.ms, d.pulse, stake, flip.edge);
        running=0;
      }
      rowEl.classList.remove('step-live');
      await wait(tail);
      continue;
    }

    await wait(gap);
    // win adds this line's profit; loss takes its portion away — never resets
    const target = running + delta;
    // The big number tracks POSITION, not this line. Colouring it per-line
    // contradicted the actual result in 15 combinations — e.g. a 1.6× hit after
    // two misses ended on 48 from a 90 stake and still read green. Colour is set
    // per-frame inside countUp so it deepens as the number moves.
    await countUp(running, target, d.ms, d.pulse, stake, flip.edge);
    running = target;

    rowEl.classList.remove('step-live');
    await wait(tail);
  }
  // RIDE pays once, at the end, and only if every call landed.
  if(betMode==='ride' && alive){
    const target=stake*rideMult();
    const d=dramaOf(target-running, stake);
    await countUp(running, target, d.ms, d.pulse, stake, flip.edge);
    running=target;
  }
  return Math.max(0, running);          // ends on the true total return
}

function clearReveal(){
  document.querySelectorAll('.res-win,.res-loss,.res-edge').forEach(e=>e.classList.remove('res-win','res-loss','res-edge'));
  document.querySelectorAll('.step-live').forEach(e=>e.classList.remove('step-live'));
  const t=$('#stepTotal'); if(t){ t.style.visibility='hidden'; t.textContent='0'; t.style.color=''; }
  const sl=$('#spinLanded'); if(sl){ sl.style.visibility='hidden'; sl.textContent=''; }
  document.querySelectorAll('.row-amt.amt-hidden').forEach(e=>e.classList.remove('amt-hidden'));
}

function resolveSpins(flip){
  // both sides in rotations — the unit the player typed and the counter showed
  const landed=toRot(flip.spins), {line,mode}=bet.spins;
  return mode==='gt' ? landed>line : mode==='lt' ? landed<line : landed===line;
}

// The coin is locked until there's a stake, a side pick, and enough bankroll.
// the whole wallet always rides, so all that's needed is a side call
function canFlip(){
  if(timerRunning()) return false;     // stake is frozen once the flip goes live
  // Not `<= 0`: NaN fails every comparison, so a corrupted balance sailed
  // straight through this guard and staked garbage.
  if(!Number.isFinite(player.balance) || player.balance<=0) return false;
  if(!bet.side) return false;
  // an unwinnable RIDE is not a bet, it is a donation
  if(betMode==='ride' && rideMult()===0) return false;
  return true;
}
// coin is inert until the bet is valid
function updateFlipLock(){
  const c=$('#coinVis'); if(c) c.classList.toggle('locked', !canFlip());
}
let flipping=false;
async function doFlip(){
  if(flipping) return;
  if(!canFlip()) return;                 // locked until a bet is placed
  // try/FINALLY, not try/catch: the lock MUST come off even when the flip dies
  // half way. Without it a single throw anywhere in the reveal — a missing
  // element, a render error — left `flipping` true forever, and every later
  // flip became a silent no-op while the coin still looked enabled. The player
  // keeps their money, so the cleaning game will not offer itself either: a
  // funded account that can never play again. The error is still rethrown,
  // because swallowing it would hide the actual fault.
  flipping=true;
  try{
  const stake=player.balance;          // no stake field — the wallet is the bet
  const p=portions();

  const seed=crypto.getRandomValues(new Uint32Array(4)).join('-');
  const flip=await resolveFlip(seed);
  await playFlip(flip);

  const returned = await revealResults(flip, stake, p);   // staged, step by step
  const lines=p.map(x=>`${x.key} ${fmtMult(x.mult)}× [${winOf(x,flip)?'WIN':'LOSS'}]`);
  const totalRisk=stake;                                  // entered amount IS the risk
  // The balance AS IT WAS WHEN THE FLIP WENT LIVE, not as it is now. This used
  // to re-read player.balance after the reveal had been awaited, so anything
  // that moved money during those three seconds was silently subtracted twice —
  // once by the mover and once here. Belt and braces with the canBank() gate
  // above: that stops the only known mover, this makes the settlement
  // self-consistent whatever else is added later.
  const startBalance=stake;
  const endBalance=Math.round(startBalance-totalRisk+returned);
  player.history.push({ startBalance, endBalance, totalStaked:totalRisk, bustedYesterday:false,
    bets:p.map(x=>({stake:x.w*stake, payoutMultiple:x.mult, kind:x.key, won:winOf(x,flip)})) });
  player.balance=endBalance; day=player.history.length; save();
  renderResult(flip, startBalance, endBalance, lines, totalRisk);
  // §4 keeps the board intact after a flip, but busting is now the COMMON case:
  // with the whole wallet riding, a loss must drop straight to the broke screen or
  // the coin just locks at 0 with no way to carry on.
  await refresh(player.balance>0 ? {keep:true} : undefined);
  } finally { flipping=false; }
}
// ---- busker mode: the clean pays out ---------------------------------------
// The old Broke Flip could pay 0, which cost the player a second day for the
// crime of having lost. This cannot: the payout is banded 40..60 and the band is
// enforced inside payoutFor(), so every path out of here puts money in the
// wallet. That is the whole point — it is the ONLY way back in from 0 B, and a
// path that pays nothing is a dead account, not a balance problem.
async function cleanPayout(){
  if(flipping) return;
  if(!clean || !clean.done) return;
  if(!canClean()) return;              // the gate holds in LOGIC, not just CSS
  // Same reasoning as doFlip, and it matters MORE here: this is the only route
  // back from 0 B, so a stuck lock is not an inconvenience, it is a dead account.
  flipping=true;
  try{

  // Into the WALLET, never the bank. Banking is a separate, deliberate act, and
  // money that arrived straight in the bank could never be risked.
  const paid=clean.payout;
  player.history.push({ startBalance:0, endBalance:paid, totalStaked:0, bustedYesterday:true,
    bets:[{stake:0, payoutMultiple:0, kind:'clean', cleaned:clean.cleaned, won:true}] });
  player.balance=paid; day=player.history.length; save();

  const res=$('#brokeResult');
  res.textContent='+'+paid; res.style.color='#1a9e3f';

  await refresh();                     // paid > 0 always, so this returns to the board
  } finally { flipping=false; }
}
function renderResult(flip, sb, eb, lines, stake){
  const block=document.createElement('div');
  block.innerHTML=`<hr><p>shown <b>${flip.startFace}</b> → landed <b>${flip.side}</b>, spin: <b>${toRot(flip.spins).toFixed(1)}</b>, orientation: <b>${flip.orientationDeg.toFixed(2)}°</b> (${flip.quadrant})</p>
    <p>${Math.round(sb)} → ${Math.round(eb)} ₿ (staked ${stake})</p><pre>${lines.join('\n')}</pre>`;
  $('#out').prepend(block);
}

$('#debugReset').addEventListener('click', async ()=>{
  player={balance:0, history:[], bank:0}; day=0; save();
  $('#out').innerHTML='';
  $('#brokeResult').textContent='';
  clean=null;                       // drop any scrub in progress with the money
  clearReveal();
  await refresh();
});
// BUSKER MODE — the coin is inert while the cooldown runs, exactly like the
// flip. Cleaning IS the daily flip: it pushes a history entry and spends the
// day, which is what stops it being farmed. Without that, busting would be free
// and the one-flip-a-day rule would stop meaning anything.
// THE SAFETY NET HAS TO CATCH A BROKEN WALLET TOO, not only an empty one.
// `NaN <= 0` is false, so a corrupted balance used to slip past this and leave
// the player with no way back in at all. Anything that is not a usable positive
// number counts as broke, because the alternative is a dead account.
function canClean(){
  const b = player.balance;
  return (!Number.isFinite(b) || b<=0) && !timerRunning();
}
function updateBrokeLock(){
  const c=$('#cleanCoin');
  if(c) c.classList.toggle('locked', !canClean());
}

// the scrub. One pointer code path for mouse, pen and touch.
$('#cleanCoin').addEventListener('pointerdown', ev=>{
  if(!canClean() || flipping) return;
  cleanDown=true;
  $('#cleanCoin').classList.add('scrubbing');
  try{ $('#cleanCoin').setPointerCapture(ev.pointerId); }catch{}
  cleanScrub(ev);
  ev.preventDefault();
});
$('#cleanCoin').addEventListener('pointermove', ev=>{
  if(!cleanDown) return;
  cleanScrub(ev);
  ev.preventDefault();
});
const cleanRelease=()=>{
  cleanDown=false;
  $('#cleanCoin').classList.remove('scrubbing');
  if(clean) clean.lift();
};
$('#cleanCoin').addEventListener('pointerup', cleanRelease);
$('#cleanCoin').addEventListener('pointercancel', cleanRelease);

$('#bankBtn').addEventListener('click', doBank);
$('#bankInput').addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); doBank(); } });
$('#coinVis').addEventListener('click', doFlip);

// Timer drives the bank/flip gate. Debug buttons move it by hand: "start timer"
// opens a 60s cooldown (bank yes, flip no), "timer 00" makes the flip live again
// (flip yes, bank no). Nothing auto-starts it, so you can flip as often as you like.
function tickTimer(){
  $('#timer').textContent=fmtTimer();
  syncMoney(); updateFlipLock(); updateBrokeLock();
  // The hard cap can ONLY fire from here: a player who has stopped scrubbing
  // emits no pointer events, so nothing else would ever notice the 20 s expire.
  // Without this a player who walks away mid-scrub is stranded at 0 B forever,
  // which is the exact failure the band exists to make impossible.
  if(clean && !clean.done && clean.tick()){ renderClean(); cleanPayout(); }
}
$('#dbgTimerStart').addEventListener('click', ()=>{ timerEnd=Date.now()+60000; tickTimer(); });
$('#dbgTimerZero').addEventListener('click', ()=>{ timerEnd=0; tickTimer(); });
setInterval(tickTimer, 500);

refresh();
</script>
</body>
</html>
